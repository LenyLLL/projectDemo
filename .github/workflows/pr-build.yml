name: Pull request build
on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install from lockfile
        run: npm ci
      - name: Focused recovery logic tests
        run: npm test
      - name: Production build
        run: npm run build
