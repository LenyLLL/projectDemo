name: Pull request build

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose checked-out npm workspace
        run: |
          printf 'GITHUB_WORKSPACE=%s\n' "$GITHUB_WORKSPACE"
          printf 'PWD=%s\n' "$PWD"
          ls -l "$GITHUB_WORKSPACE/package.json" "$GITHUB_WORKSPACE/package-lock.json"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install from checked-in lockfile
        working-directory: ${{ github.workspace }}
        run: npm ci
      - name: Build
        working-directory: ${{ github.workspace }}
        run: npm run build
