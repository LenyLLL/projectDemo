name: Pull request build

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Diagnose npm workspace after setup-node
        working-directory: ${{ github.workspace }}
        run: |
          printf 'GITHUB_WORKSPACE=%s\n' "$GITHUB_WORKSPACE"
          printf 'PWD=%s\n' "$PWD"
          ls -l package.json package-lock.json
          npm config get package-lock
          node -e "const p=JSON.parse(require('fs').readFileSync('package-lock.json','utf8')); console.log('lockfileVersion='+p.lockfileVersion)"
      - name: Install from checked-in lockfile
        working-directory: ${{ github.workspace }}
        run: npm ci
      - name: Focused recovery logic tests
        working-directory: ${{ github.workspace }}
        run: npm test
      - name: Build
        working-directory: ${{ github.workspace }}
        run: npm run build
